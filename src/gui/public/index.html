<!doctype html>
<html lang="fa" dir="rtl" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyrusAsha_GuiForOpenDataLoaderPDF-1.0.0</title>
  <meta name="description" content="CyrusAsha control center for OpenDataLoader PDF — Code. Intelligence. Order.">
  <link rel="icon" href="brand/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved language and theme before the first paint (no flicker).
    (function () {
      try {
        var lang = localStorage.getItem('odl.lang') || 'fa';
        var theme = localStorage.getItem('odl.theme') || 'auto';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* storage disabled - keep defaults */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="layout">
    <header class="topbar" id="topbar"></header>
    <nav class="sidebar" id="nav"></nav>
    <main class="main" id="main">
      <div id="view"><div class="boot">…</div></div>
      <footer class="site-footer" id="footer"></footer>
    </main>
  </div>

  <!-- Shown while files are dragged over the window -->
  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-overlay-box" id="drop-overlay-text"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="js/i18n.js"></script>
  <script src="js/util.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/components.js"></script>
  <script src="js/page-convert.js"></script>
  <script src="js/page-jobs.js"></script>
  <script src="js/page-hybrid.js"></script>
  <script src="js/page-setup.js"></script>
  <script src="js/page-rules.js"></script>
  <script src="js/page-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
